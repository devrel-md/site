name: Deploy

# Deploys only follow a green CI run. The CI workflow runs on every push to main; when it
# finishes, this workflow starts for that same commit if, and only if, it succeeded.
# workflow_dispatch stays for manual redeploys of the current head of main. Either way, a run only
# deploys if its commit is still the tip of main when it starts (see the guard step).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openship-devrelmd-production
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run, github.ref and github.sha point at the default branch head, not at the
    # commit CI ran on, so every use below takes the SHA from the CI run instead.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    # The runner lives on the OpenShip box, the only place its API is reachable from.
    runs-on: [self-hosted, openship, devrelmd]
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # CI runs for two merges can finish in the opposite order to the merges, and the concurrency
      # group above queues deploys rather than cancelling them, so an older commit's deploy could
      # run after a newer one and overwrite it. Only the commit at the tip of main may deploy.
      # This runs when the job actually starts (after any queueing), before migrations, so an older
      # commit never applies anything after a newer one. If the lookup fails the job fails: never
      # deploy without knowing this is the head.
      - name: Check this commit is still the head of main
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tip="$(curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/$REPO/commits/heads/main")"
          if ! printf '%s' "$tip" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Deploy guard::Could not read the head of main, so nothing was deployed."
            exit 1
          fi
          if [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "::notice title=Deploy skipped::main moved on to $tip; this run deploys nothing; the run for that commit will deploy it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          sparse-checkout: |
            package.json
            db
            scripts/openship-deploy.py
          sparse-checkout-cone-mode: false
      # Migrations run before the app deploys, never after, so new tables and columns exist
      # before any code that uses them goes live. Keep migrations additive (no drops or renames
      # in the same change as the code) so the running version keeps working in between.
      # Only pg is needed, so install that alone rather than the whole app.
      - name: Apply pending database migrations
        if: steps.guard.outputs.skip != 'true'
        run: |
          work="$RUNNER_TEMP/migrate"
          rm -rf "$work" && mkdir -p "$work"
          cp -r db "$work/"
          cd "$work"
          printf '{"type":"module","private":true}' > package.json
          npm install --silent --no-audit --no-fund "pg@$(node -p "require('$GITHUB_WORKSPACE/package.json').dependencies.pg")"
          set -a && . "$HOME/devrelmd/deploy.env" && set +a
          node db/migrate.ts
      - name: Deploy and verify health
        if: steps.guard.outputs.skip != 'true'
        env:
          SHA: ${{ env.DEPLOY_SHA }}
        run: python3 scripts/openship-deploy.py
