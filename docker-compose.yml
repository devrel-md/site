services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devrelmd
      POSTGRES_PASSWORD: devrelmd
      POSTGRES_DB: devrelmd
    ports:
      - "5432:5432"
    volumes:
      - devrelmd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrelmd -d devrelmd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devrelmd-postgres:
