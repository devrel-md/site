name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel their own superseded runs. Pushes to main are keyed by commit and never
# cancelled, because the deploy workflow waits for this run to finish on that exact commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the status check name that branch protection requires: "ci".
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets and no database. The tests mock the database, OpenRouter, Resend and Folk, and
    # the build does not connect to anything, so none of those variables are set here.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
